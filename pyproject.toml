[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "educability-annotator"
version = "0.1.0"
description = "Anotação incremental e distribuída de corpora com o classificador de educabilidade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.7.1,<3",
  "transformers==4.53.3",
  "huggingface-hub>=0.30,<1",
  "pyarrow>=20,<27",
]

[project.optional-dependencies]
hub = ["datasets==4.4.1"]
test = ["pytest>=8,<10", "psutil>=6"]

[project.scripts]
educability-annotator = "educability_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: processos reais e modelo pequeno local",
  "hub: modelo publicado; requer download explícito",
  "cuda: requer GPU NVIDIA",
]
